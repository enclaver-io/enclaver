server {
    # Reachable from the enclaves, which come in over the host's network stack.
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "example.org"
    data_dir = "/opt/spire/data"
    log_level = "DEBUG"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }

    # Attests an enclave from its Nitro attestation document and names it
    # spiffe://example.org/spire/agent/nitro-enclave/<PCR0>. There is no
    # separate SPIRE agent here: odyn speaks the agent side of the protocol
    # from inside the enclave, so the node and the workload are the same thing.
    NodeAttestor "nitro_enclave" {
        plugin_cmd = "/opt/spire/bin/spire-nitro-enclave-plugin"
        plugin_data {}
    }

    # Roots the whole trust domain at a CA that outlives SPIRE's own signing
    # keys. The enclaves pin this root (ca_cert in enclaver.yaml) to
    # authenticate the SPIRE server, and it is measured into PCR0, so pinning
    # something that rotates would mean rebuilding and re-registering the
    # enclaves every rotation.
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/opt/spire/conf/ca/ca.crt"
            key_file_path  = "/opt/spire/conf/ca/ca.key"
        }
    }
}
